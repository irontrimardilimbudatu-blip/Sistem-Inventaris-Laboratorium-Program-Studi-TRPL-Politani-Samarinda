<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PinjamLab</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone">

  <div class="sheet-handle"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="clock">09.41</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-3"/><path d="M9 20v-6"/><path d="M14 20v-9"/><path d="M19 20V4"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg>
      <svg class="battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="18" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><rect x="4" y="9" width="12" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
    </div>
  </div>

  <div class="content" style="gap:20px;">
    <!-- Identitas Aplikasi -->
    <div class="brand-row">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l4 2.3v4.6L12 11.2 8 8.9V4.3L12 2z"/>
          <path d="M12 6.6V2m0 4.6L8 8.9m4-2.3l4 2.3"/>
          <path d="M7 10.7l4 2.3v4.6l-4 2.3-4-2.3v-4.6l4-2.3z"/>
          <path d="M7 15.3v-4.6m0 4.6l-4 2.3m4-2.3l4 2.3"/>
          <path d="M17 10.7l4 2.3v4.6l-4 2.3-4-2.3v-4.6l4-2.3z"/>
          <path d="M17 15.3v-4.6m0 4.6l-4 2.3m4-2.3l4 2.3"/>
        </svg>
      </div>
      <span class="brand-name">PinjamLab</span>
      <span class="scope">LAB TEKNIK</span>
    </div>

    <!-- Sampul Bengkel (Hero) -->
    <div class="hero">
      <div class="hero-overlay"></div>
      <span class="eyebrow">RUANG UNTUK BERKARYA</span>
      <h2>Alat siap. Ide jalan.</h2>
      <p class="sub">Pinjam kebutuhan praktik, tanpa ribet.</p>
    </div>

    <!-- Sambutan -->
    <div style="display:flex;flex-direction:column;gap:4px;">
      <h1 style="margin:0;font-size:22px;font-weight:700;color:var(--heading);">Selamat datang kembali</h1>
      <p style="margin:0;font-size:13px;color:var(--muted);">Masuk dengan akun kampus untuk mulai meminjam.</p>
    </div>

    <!-- Form Masuk -->
    <form id="login-form" style="display:flex;flex-direction:column;gap:14px;width:100%;">
      <div class="field">
        <label for="email-input">Email kampus</label>
        <div class="input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
          <input type="email" id="email-input" required value="raka.pratama@mahasiswa.ac.id" placeholder="nama@mahasiswa.ac.id">
        </div>
      </div>

      <div class="field">
        <label for="role-input">Masuk sebagai</label>
        <select id="role-input" class="workflow-select">
          <option value="mahasiswa">Mahasiswa</option>
          <option value="dosen">Dosen</option>
          <option value="laboran">Laboran</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="field">
        <label for="password-input">Kata sandi</label>
        <div class="input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1.5"/></svg>
          <input type="password" id="password-input" required value="raka12345" placeholder="Masukkan kata sandi">
          <button type="button" class="eye" data-toggle-password aria-label="Lihat kata sandi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
          </button>
        </div>
      </div>

      <div class="card-row-between">
        <div class="checkbox-row">
          <button type="button" class="checkbox" data-toggle-check aria-label="Ingat saya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          <span>Ingat saya</span>
        </div>
        <a href="#" id="forgot-password-link" style="font-size:12px;font-weight:600;color:var(--primary);">Lupa kata sandi?</a>
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top:4px;">
        Masuk <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <!-- Bantuan Akun -->
    <div style="display:flex;gap:4px;justify-content:center;width:100%;font-size:12px;margin-top:2px;">
      <span style="color:var(--muted);">Belum punya akses?</span>
      <a href="#" id="contact-admin-link" style="color:var(--primary);font-weight:600;">Hubungi admin lab</a>
    </div>

    <!-- Keamanan Akun -->
    <div class="note-row" style="justify-content:center;width:100%;margin-top:auto;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
      <span>Akses aman untuk civitas akademika</span>
    </div>
  </div>

  <!-- Navigasi Sistem -->
  <div class="home-indicator"><span></span></div>
</div>

<script src="js/data-barang.js"></script>
<script src="script.js"></script>
<script src="js/workflow.js"></script>
</body>
</html>
