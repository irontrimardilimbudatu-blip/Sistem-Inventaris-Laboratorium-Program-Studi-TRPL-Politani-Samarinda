<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan QR Code — PinjamLab</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="clock">09.41</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-3"/><path d="M9 20v-6"/><path d="M14 20v-9"/><path d="M19 20V4"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg>
      <svg class="battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="18" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><rect x="4" y="9" width="12" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
    </div>
  </div>

  <!-- Judul Halaman -->
  <div class="page-header">
    <a class="back-btn" href="form-pengajuan.html" aria-label="Kembali ke form pengajuan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <div class="title-wrap">
      <h1>Scan QR Code</h1>
    </div>
    <button class="icon-btn" id="scanner-help-btn" aria-label="Bantuan scanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.9.4-1.4 1-1.4 2"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </button>
  </div>

  <!-- Konten Scanner -->
  <div class="content" style="gap:14px;">

    <!-- Badge Petunjuk Pemindaian -->
    <div>
      <span class="badge badge-blue" style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l4 2.3v4.6L12 11.2 8 8.9V4.3L12 2z"/>
          <path d="M12 6.6V2m0 4.6L8 8.9m4-2.3l4 2.3"/>
          <path d="M7 10.7l4 2.3v4.6l-4 2.3-4-2.3v-4.6l4-2.3z"/>
          <path d="M7 15.3v-4.6m0 4.6l-4 2.3m4-2.3l4 2.3"/>
          <path d="M17 10.7l4 2.3v4.6l-4 2.3-4-2.3v-4.6l4-2.3z"/>
          <path d="M17 15.3v-4.6m0 4.6l-4 2.3m4-2.3l4 2.3"/>
        </svg> Tambah alat ke pengajuan
      </span>
    </div>

    <!-- Judul & Deskripsi Pemindaian -->
    <div style="display:flex;flex-direction:column;gap:4px;width:100%;">
      <h2 style="margin:0;font-size:18px;font-weight:700;color:var(--primary-dark);">Arahkan kamera ke QR alat</h2>
      <p style="margin:0;font-size:12px;color:var(--muted);line-height:1.45;">Posisikan QR Code pada label inventaris di dalam kotak. Alat akan terdeteksi otomatis.</p>
    </div>

    <!-- Area Kamera Viewfinder -->
    <div class="camera-area" id="camera-area" title="Ketuk area kamera untuk mensimulasikan pemindaian QR Code">
      <div class="scan-box">
        <div class="scan-corner tl"></div>
        <div class="scan-corner tr"></div>
        <div class="scan-corner bl"></div>
        <div class="scan-corner br"></div>
        <div class="scan-line"></div>
      </div>
      <div class="scan-status"><span class="dot"></span> Mencari QR Code&hellip;</div>
    </div>

    <!-- Opsi Pemindaian: Flash & Ganti Kamera -->
    <div class="control-row">
      <div class="control-card" id="flash-toggle-btn" role="button" aria-label="Toggle lampu flash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <div>
          <div class="label">Flash</div>
          <div class="sub">Nonaktif</div>
        </div>
      </div>
      <div class="control-card" id="camera-switch-btn" role="button" aria-label="Beralih kamera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/><path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/><circle cx="12" cy="12" r="3"/><path d="m18 22-3-3 3-3"/><path d="m6 2 3 3-3 3"/></svg>
        <div>
          <div class="label">Ganti kamera</div>
          <div class="sub">Kamera belakang</div>
        </div>
      </div>
    </div>

    <!-- Banner Info -->
    <div class="info-banner" style="background:#eff6ff;border-color:#dbeafe;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
      <span>Pastikan label terlihat jelas dan kamera stabil saat memindai.</span>
    </div>

  </div>

  <!-- Alternatif Pemindaian: Bottom Bar -->
  <div class="bottom-bar">
    <button type="button" class="btn btn-outline" id="manual-code-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="10" x2="6" y2="10.01"/><line x1="10" y1="10" x2="10" y2="10.01"/><line x1="14" y1="10" x2="14" y2="10.01"/><line x1="18" y1="10" x2="18" y2="10.01"/><line x1="6" y1="14" x2="18" y2="14"/></svg> Masukkan kode alat manual
    </button>
  </div>

  <!-- Navigasi Sistem -->
  <div class="home-indicator"><span></span></div>
</div>

<script src="script.js"></script>
<script src="js/script.js"></script>
</body>
</html>
